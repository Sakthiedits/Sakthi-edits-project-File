<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sakthiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sakthiBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b1f7a" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Container -->
  <rect width="64" height="64" rx="16" fill="#080414"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#sakthiBorder)" stroke-width="2"/>

  <!-- Glowing Aura behind letter -->
  <circle cx="32" cy="32" r="16" fill="#7c3aed" opacity="0.25" filter="url(#glow)"/>

  <!-- Bold Modern 'S' with high visibility -->
  <path d="M42 20H26C22.134 20 19 23.134 19 27C19 30.866 22.134 34 26 34H38C41.866 34 45 37.134 45 41C45 44.866 41.866 48 38 48H22"
        stroke="url(#sakthiGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Play mark accent inside top-right -->
  <polygon points="46,15 52,18.5 46,22" fill="#f472b6"/>
</svg>